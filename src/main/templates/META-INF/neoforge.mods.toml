modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
logoFile="logo.png"
authors="${mod_authors}"
description='''
Manufacture golems on Create production lines and animate them with Iron's Spells 'n Spellbooks magic.
'''

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[21.1.200,)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="create"
    type="required"
    versionRange="[${create_release_version},6.1.0)"
    ordering="AFTER"
    side="BOTH"

# Iron's Spells reports versions such as "1.21.1-3.16.3". The range below is checked against the
# real string by the dev runs (the mod will not load if it is rejected). See docs/DECISIONS.md.
[[dependencies.${mod_id}]]
    modId="irons_spellbooks"
    type="required"
    versionRange="[${irons_spells_version},)"
    ordering="AFTER"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="geckolib"
    type="required"
    versionRange="[${geckolib_version},)"
    ordering="AFTER"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="jei"
    type="optional"
    versionRange="[19,)"
    ordering="NONE"
    side="CLIENT"

[[dependencies.${mod_id}]]
    modId="create_wizardry"
    type="optional"
    versionRange="*"
    ordering="AFTER"
    side="BOTH"
